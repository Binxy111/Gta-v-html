<!DOCTYPE html>
<html>
<head>
<title>Canvas GTA-like Game</title>
<style>
  body { margin: 0; }
  canvas { display: block; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
 const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  canvas.width = 800;
  canvas.height = 600;

  const player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 10,
    speed: 5,
    color: 'blue'
  };

  const keys = {};
  let mapImage = new Image();
  mapImage.src = 'https://cs3.gtaall.com/screenshots/4dc09/2015-07/original/8dda1661dc4e7cbfbc4a80e8a9db5995223311b4/281901-GTA5-2015-07-27-15-39-18-247.jpg'; // Replace 'map.png' with the actual path to your image

  document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
  });

  document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
  });

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  function update() {
    if (keys['w'] || keys['ArrowUp']) {
      player.y -= player.speed;
    }
    if (keys['s'] || keys['ArrowDown']) {
      player.y += player.speed;
    }
    if (keys['a'] || keys['ArrowLeft']) {
      player.x -= player.speed;
    }
    if (keys['d'] || keys['ArrowRight']) {
      player.x += player.speed;
    }

    // Keep player within bounds (relative to the visible canvas)
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw the map background
    ctx.drawImage(mapImage, 0, 0, canvas.width, canvas.height); // Draw the image to fill the canvas

    // Draw the player
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.fill();
    ctx.closePath();
  }

  // Ensure the map image loads before starting the game loop (optional but recommended)
  mapImage.onload = () => {
    gameLoop();
  };

  // Start the game loop immediately if you don't want to wait for the image to load
  // gameLoop();
</script>

</body>
</html>
